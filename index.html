<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン当てられるかな？</title>
  <!-- リアルタイム通信用のPeerJSライブラリ -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px 10px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 15px;
      text-align: center;
    }
    #room-status-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    #room-info {
      font-size: 0.9rem;
      color: #3b4cca;
      font-weight: bold;
    }
    #player-count-badge {
      display: none;
      font-size: 0.8rem;
      background-color: #e7f5ff;
      color: #1971c2;
      border: 1px solid #a5d8ff;
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: bold;
    }
    /* 12行 × 5列のグリッド */
    #board {
      display: grid;
      grid-template-rows: repeat(12, 1fr);
      gap: 4px;
      margin-bottom: 15px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .tile {
      width: 40px;
      height: 40px;
      border: 2px solid #dee2e6;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 4px;
      user-select: none;
    }
    /* 判定後の色 */
    .correct { background-color: #6aaa64; color: white; border-color: #6aaa64; }
    .present { background-color: #c9b458; color: white; border-color: #c9b458; }
    .absent  { background-color: #787c7e; color: white; border-color: #787c7e; }

    /* 入力エリア */
    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      font-size: 1.1rem;
      padding: 8px 12px;
      width: 150px;
      text-align: center;
      border: 2px solid #adb5bd;
      border-radius: 6px;
    }
    button {
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 14px;
      background-color: #3b4cca;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background-color: #2a3696; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .sub-btn { background-color: #495057; }
    .sub-btn:hover:not(:disabled) { background-color: #343a40; }

    #message {
      min-height: 24px;
      font-weight: bold;
      color: #d9534f;
      margin-bottom: 10px;
      text-align: center;
      font-size: 0.9rem;
    }
    .win-msg { color: #2b8a3e !important; }

    /* シェア・リスタートボタン */
    .action-buttons {
      display: none;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .share-btn { background-color: #1da1f2; }
    .share-btn:hover { background-color: #0d8ddb; }

    /* マルチプレイ中の部屋情報バー */
    #active-room-panel {
      display: none;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 0.85rem;
      max-width: 320px;
      width: 100%;
    }
    .room-id-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f3f5;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      margin-top: 4px;
    }

    /* 下部マルチプレイエリア */
    #multi-section {
      margin-top: 25px;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    #multi-section h3 {
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 10px;
      color: #495057;
    }
    .multi-box {
      margin-bottom: 12px;
    }

    footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #868e96;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <h1>ポケモン当てられるかな？</h1>
  
  <div id="room-status-bar">
    <div id="room-info">👤 1人プレイモード</div>
    <div id="player-count-badge">👥 現在 1人 が参加中</div>
  </div>

  <!-- マルチプレイ中のID表示＆退出パネル -->
  <div id="active-room-panel">
    <div>部屋ID（共有してね）</div>
    <div class="room-id-copy">
      <span id="display-room-id">---</span>
      <button id="copy-id-btn" style="font-size:0.75rem; padding:3px 8px;">コピー</button>
    </div>
    <div style="margin-top:8px;">
      <button id="quick-leave-btn" class="sub-btn" style="font-size:0.75rem; padding:4px 10px;">部屋を抜ける</button>
    </div>
  </div>

  <div class="subtitle" id="turn-indicator">5文字のポケモン名を12回以内に当てよう！</div>

  <!-- ゲーム盤面 -->
  <div id="board"></div>

  <div id="message"></div>

  <div class="input-area" id="input-area">
    <input type="text" id="guess-input" maxlength="5" placeholder="例：ピカチュウ" autocomplete="off">
    <button id="submit-btn">決定</button>
  </div>

  <div class="action-buttons" id="action-buttons">
    <button class="share-btn" id="share-btn">結果をコピー</button>
    <button class="sub-btn" id="reset-btn">もう一回遊ぶ</button>
    <button class="sub-btn" id="leave-multi-btn" style="display:none;">1人プレイに戻る</button>
  </div>

  <!-- 画面下部のマルチプレイ用エリア -->
  <div id="multi-section">
    <h3>👥 友達と一緒に遊ぶ（マルチプレイ）</h3>
    <div class="multi-box">
      <button id="create-room-btn" style="font-size:0.85rem; padding:6px 12px;">部屋を作る</button>
    </div>
    <div style="border-top:1px solid #eee; margin:10px 0;"></div>
    <div class="multi-box">
      <input type="text" id="room-id-input" placeholder="部屋IDを入力" style="font-size:0.9rem; width: 130px; padding: 4px 8px;">
      <button id="join-room-btn" class="sub-btn" style="font-size:0.85rem; padding:6px 10px;">参加する</button>
    </div>
    <div id="lobby-message" style="color: #d9534f; font-size: 0.75rem; margin-top: 5px;"></div>
  </div>

  <footer>
    非公式ファンメイドゲーム
  </footer>

    ].filter(name => name.length === 5);

    const MAX_TRIES = 12;
    let isMulti = false;
    let peer = null;
    let isHost = false;

    // マルチ用状態管理
    let hostConnections = []; // ホストが保持するゲスト接続配列
    let guestConn = null;       // ゲストが保持するホストへの接続
    let playerOrder = [];       // ターン順のPeerID配列（[ホストID, ゲスト1ID, ...]）
    let currentTurnIndex = 0;   // 現在のターンがplayerOrderの何番目か
    let myPeerId = "";

    let targetWord = "";
    let currentRow = 0;
    let gameOver = false;
    let emojiHistory = [];
    let boardHistory = []; // 途中参加者向けの盤面履歴

    // DOM要素
    const roomInfo = document.getElementById("room-info");
    const playerCountBadge = document.getElementById("player-count-badge");
    const activeRoomPanel = document.getElementById("active-room-panel");
    const displayRoomId = document.getElementById("display-room-id");
    const turnIndicator = document.getElementById("turn-indicator");
    const board = document.getElementById("board");
    const inputArea = document.getElementById("input-area");
    const input = document.getElementById("guess-input");
    const submitBtn = document.getElementById("submit-btn");
    const messageEl = document.getElementById("message");
    const actionButtons = document.getElementById("action-buttons");
    const lobbyMessage = document.getElementById("lobby-message");
    const resetBtn = document.getElementById("reset-btn");
    const leaveMultiBtn = document.getElementById("leave-multi-btn");
    const multiSection = document.getElementById("multi-section");

    // 人数表示の更新
    function updatePlayerCount(count) {
      playerCountBadge.style.display = "inline-block";
      playerCountBadge.textContent = `👥 現在 ${count}人 が部屋にいます`;
    }

    // 【ホスト】全ゲストに最新の部屋状態（人数・ターン・盤面など）を配信
    function broadcastRoomState(extraData = {}) {
      if (!isHost) return;
      // 切断済みの接続を掃除
      hostConnections = hostConnections.filter(c => c.open);
      const activeIds = [myPeerId, ...hostConnections.map(c => c.peer)];
      playerOrder = activeIds;

      if (currentTurnIndex >= playerOrder.length) {
        currentTurnIndex = 0;
      }

      const totalPlayers = playerOrder.length;
      updatePlayerCount(totalPlayers);
      updateTurnDisplay();

      const payload = {
        type: 'SYNC_STATE',
        totalPlayers: totalPlayers,
        currentTurnPeerId: playerOrder[currentTurnIndex],
        targetWord: targetWord,
        boardHistory: boardHistory,
        gameOver: gameOver,
        ...extraData
      };

      hostConnections.forEach(c => {
        if (c.open) c.send(payload);
      });
    }

    // マルチ：部屋作成（ホスト）
    document.getElementById("create-room-btn").addEventListener("click", () => {
      lobbyMessage.textContent = "部屋を作成中...";
      peer = new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        isMulti = true;
        isHost = true;
        hostConnections = [];
        playerOrder = [id];
        currentTurnIndex = 0;

        displayRoomId.textContent = id;
        activeRoomPanel.style.display = "block";
        multiSection.style.display = "none";
        lobbyMessage.textContent = "";

        initGame();
        updatePlayerCount(1);
        updateTurnDisplay();
      });

      peer.on('connection', (connection) => {
        connection.on('open', () => {
          hostConnections.push(connection);
          broadcastRoomState();
        });

        connection.on('data', (data) => {
          if (data.type === 'GUEST_GUESS') {
            handleGuessExecution(data.guess, connection.peer);
          }
        });

        connection.on('close', () => {
          broadcastRoomState();
        });
      });

      peer.on('error', (err) => {
        lobbyMessage.textContent = "通信エラーが発生しました。もう一度試してね。";
      });
    });

    // マルチ：部屋参加（ゲスト）
    document.getElementById("join-room-btn").addEventListener("click", () => {
      const roomId = document.getElementById("room-id-input").value.trim();
      if (!roomId) {
        lobbyMessage.textContent = "部屋IDを入力してね";
        return;
      }

      lobbyMessage.textContent = "部屋に接続中...";
      peer = new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        guestConn = peer.connect(roomId);

        guestConn.on('open', () => {
          isMulti = true;
          isHost = false;
          displayRoomId.textContent = roomId;
          activeRoomPanel.style.display = "block";
          multiSection.style.display = "none";
          lobbyMessage.textContent = "";
          initGame();
        });

        guestConn.on('data', (data) => {
          if (data.type === 'SYNC_STATE') {
            targetWord = data.targetWord;
            updatePlayerCount(data.totalPlayers);
            syncBoardFromHistory(data.boardHistory);

            if (data.lastEvent) {
              if (data.lastEvent.isWin) {
                showMessage(`正解！「${targetWord}」でした！`, true);
                endGame();
              } else if (data.lastEvent.isGameOver) {
                showMessage(`残念！正解は「${targetWord}」でした。`);
                endGame();
              }
            } else if (data.isReset) {
              initGame();
              updatePlayerCount(data.totalPlayers);
            }

            if (!gameOver) {
              const isMyTurn = (data.currentTurnPeerId === myPeerId);
              updateTurnDisplay(isMyTurn, data.totalPlayers);
            }
          }
        });

        guestConn.on('close', () => {
          alert("ホストとの接続が切れました。1人プレイに戻ります。");
          leaveMultiMode();
        });
      });

      peer.on('error', () => {
        lobbyMessage.textContent = "部屋が見つかりませんでした。IDを確認してね。";
      });
    });

    // 部屋IDコピーボタン
    document.getElementById("copy-id-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(displayRoomId.textContent).then(() => {
        const btn = document.getElementById("copy-id-btn");
        btn.textContent = "コピー完了!";
        setTimeout(() => btn.textContent = "コピー", 1500);
      });
    });

    // 1人プレイに戻る処理
    function leaveMultiMode() {
      if (peer) {
        peer.destroy();
        peer = null;
      }
      isMulti = false;
      isHost = false;
      hostConnections = [];
      guestConn = null;
      playerOrder = [];
      activeRoomPanel.style.display = "none";
      playerCountBadge.style.display = "none";
      multiSection.style.display = "block";
      lobbyMessage.textContent = "";
      document.getElementById("room-id-input").value = "";
      initGame();
    }

    leaveMultiBtn.addEventListener("click", leaveMultiMode);
    document.getElementById("quick-leave-btn").addEventListener("click", leaveMultiMode);

    // ゲーム初期化
    function initGame() {
      board.innerHTML = "";
      currentRow = 0;
      gameOver = false;
      emojiHistory = [];
      boardHistory = [];
      messageEl.textContent = "";
      messageEl.className = "";
      input.value = "";
      inputArea.style.display = "flex";
      actionButtons.style.display = "none";

      for (let r = 0; r < MAX_TRIES; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          rowDiv.appendChild(tile);
        }
        board.appendChild(rowDiv);
      }

      if (!isMulti) {
        targetWord = POKEMON_5_LIST[Math.floor(Math.random() * POKEMON_5_LIST.length)];
        roomInfo.textContent = "👤 1人プレイモード";
        turnIndicator.textContent = "5文字のポケモン名を12回以内に当てよう！";
        input.disabled = false;
        submitBtn.disabled = false;
        resetBtn.style.display = "inline-block";
        leaveMultiBtn.style.display = "none";
        multiSection.style.display = "block";
        input.focus();
      } else {
        roomInfo.textContent = isHost ? "🏠 マルチ（ホスト）" : "🚪 マルチ（ゲスト）";
        resetBtn.style.display = isHost ? "inline-block" : "none";
        leaveMultiBtn.style.display = "inline-block";
        if (isHost) {
          targetWord = POKEMON_5_LIST[Math.floor(Math.random() * POKEMON_5_LIST.length)];
          currentTurnIndex = 0;
        }
      }
    }

    // 履歴から盤面を再描画（ゲスト同期用）
    function syncBoardFromHistory(history) {
      if (!history) return;
      boardHistory = history;
      emojiHistory = [];
      for (let r = 0; r < history.length; r++) {
        const item = history[r];
        renderGuess(r, item.guess, item.result);
        emojiHistory.push(makeEmojiRow(item.result));
      }
      currentRow = history.length;
    }

    function updateTurnDisplay(forceIsMyTurn = null, totalCount = null) {
      if (gameOver) return;
      if (!isMulti) {
        turnIndicator.textContent = "5文字のポケモン名を12回以内に当てよう！";
        input.disabled = false;
        submitBtn.disabled = false;
        return;
      }

      const count = totalCount !== null ? totalCount : playerOrder.length;
      if (count < 2) {
        turnIndicator.textContent = "⏳ 他のプレイヤーの参加を待っています（1人でも練習入力できます）";
        input.disabled = false;
        submitBtn.disabled = false;
        return;
      }

      const isMyTurn = (forceIsMyTurn !== null)
        ? forceIsMyTurn
        : (playerOrder[currentTurnIndex] === myPeerId);

      if (isMyTurn) {
        turnIndicator.textContent = "✨ あなたのターンです！ポケモンを入力してください";
        input.disabled = false;
        submitBtn.disabled = false;
        input.focus();
      } else {
        turnIndicator.textContent = "⏳ 他のプレイヤーが入力中です...";
        input.disabled = true;
        submitBtn.disabled = true;
      }
    }

    // 決定ボタン
    submitBtn.addEventListener("click", submitGuess);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitGuess();
    });

    function submitGuess() {
      if (gameOver) return;
      const guess = input.value.trim();

      // ポリゴン2、ポリゴンZも通るように許可
      if (!/^[ァ-ヶー2Z２Z♂♀]{5}$/.test(guess)) {
        showMessage("全角カタカナ5文字で入力してね！");
        return;
      }

      if (!POKEMON_5_LIST.includes(guess)) {
        showMessage("登録されている5文字のポケモン名を入力してね！");
        return;
      }

      showMessage("");
      input.value = "";

      if (!isMulti) {
        // 1人プレイ
        handleGuessExecution(guess, myPeerId);
      } else if (isHost) {
        // マルチ（ホスト）
        if (playerOrder.length >= 2 && playerOrder[currentTurnIndex] !== myPeerId) return;
        handleGuessExecution(guess, myPeerId);
      } else {
        // マルチ（ゲスト）：ホストに判定を依頼
        if (guestConn && guestConn.open) {
          guestConn.send({ type: 'GUEST_GUESS', guess: guess });
        }
      }
    }

    // 回答の判定と進行処理（1人用＆ホスト共通）
    function handleGuessExecution(guess, senderPeerId) {
      if (gameOver) return;
      if (isMulti && playerOrder.length >= 2 && playerOrder[currentTurnIndex] !== senderPeerId) {
        return;
      }

      const result = evaluateGuess(guess, targetWord);
      renderGuess(currentRow, guess, result);
      emojiHistory.push(makeEmojiRow(result));
      boardHistory.push({ guess, result });

      const isWin = (guess === targetWord);
      const isOver = isWin || (currentRow + 1 >= MAX_TRIES);

      if (isWin) {
        showMessage(`正解！「${targetWord}」でした！`, true);
        endGame();
      } else if (isOver) {
        showMessage(`残念！正解は「${targetWord}」でした。`);
        endGame();
      } else {
        currentRow++;
        if (isMulti) {
          currentTurnIndex = (currentTurnIndex + 1) % playerOrder.length;
          updateTurnDisplay();
        } else {
          input.focus();
        }
      }

      if (isMulti && isHost) {
        broadcastRoomState({
          lastEvent: { isWin, isGameOver: isOver }
        });
      }
    }

    function makeEmojiRow(result) {
      return result.map(r => r === "correct" ? "🟩" : r === "present" ? "🟨" : "⬜").join("");
    }

    function evaluateGuess(guess, target) {
      const targetChars = target.split("");
      const guessChars = guess.split("");
      const result = Array(5).fill("absent");
      const targetUsed = Array(5).fill(false);

      for (let i = 0; i < 5; i++) {
        if (guessChars[i] === targetChars[i]) {
          result[i] = "correct";
          targetUsed[i] = true;
        }
      }
      for (let i = 0; i < 5; i++) {
        if (result[i] === "correct") continue;
        for (let j = 0; j < 5; j++) {
          if (!targetUsed[j] && guessChars[i] === targetChars[j]) {
            result[i] = "present";
            targetUsed[j] = true;
            break;
          }
        }
      }
      return result;
    }

    function renderGuess(row, guess, result) {
      const guessChars = guess.split("");
      for (let i = 0; i < 5; i++) {
        const tile = document.getElementById(`tile-${row}-${i}`);
        if (tile) {
          tile.textContent = guessChars[i];
          tile.classList.add(result[i]);
        }
      }
    }

    function showMessage(msg, isWin = false) {
      messageEl.textContent = msg;
      messageEl.className = isWin ? "win-msg" : "";
    }

    function endGame() {
      gameOver = true;
      turnIndicator.textContent = "ゲーム終了！お疲れさまでした 🎉";
      inputArea.style.display = "none";
      actionButtons.style.display = "flex";
    }

    // もう一回遊ぶボタン（1人用＆マルチのホスト用）
    resetBtn.addEventListener("click", () => {
      initGame();
      if (isMulti && isHost) {
        broadcastRoomState({ isReset: true });
      }
    });

    document.getElementById("share-btn").addEventListener("click", () => {
      const score = messageEl.classList.contains("win-msg") ? `${currentRow + 1}/${MAX_TRIES}` : `X/${MAX_TRIES}`;
      const shareText = `ポケモン5文字当てクイズ ${score}\n\n${emojiHistory.join("\n")}\n#ポケモン5文字当て`;
      navigator.clipboard.writeText(shareText).then(() => {
        alert("結果をクリップボードにコピーしました！");
      });
    });

    // 初回起動時（1人プレイとしてスタート）
    initGame();
  </script>
</body>
</html>
