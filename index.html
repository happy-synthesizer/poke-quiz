<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン当てられるかな？</title>
  <!-- リアルタイム通信用のPeerJSライブラリ -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px 10px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 15px;
      text-align: center;
    }
    #room-info {
      font-size: 0.9rem;
      color: #3b4cca;
      font-weight: bold;
      margin-bottom: 10px;
    }
    /* 12行 × 5列のグリッド */
    #board {
      display: grid;
      grid-template-rows: repeat(12, 1fr);
      gap: 4px;
      margin-bottom: 15px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .tile {
      width: 40px;
      height: 40px;
      border: 2px solid #dee2e6;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 4px;
      user-select: none;
    }
    /* 判定後の色 */
    .correct { background-color: #6aaa64; color: white; border-color: #6aaa64; }
    .present { background-color: #c9b458; color: white; border-color: #c9b458; }
    .absent  { background-color: #787c7e; color: white; border-color: #787c7e; }

    /* 入力エリア */
    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      font-size: 1.1rem;
      padding: 8px 12px;
      width: 150px;
      text-align: center;
      border: 2px solid #adb5bd;
      border-radius: 6px;
    }
    button {
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 14px;
      background-color: #3b4cca;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #2a3696; }
    .sub-btn { background-color: #495057; }
    .sub-btn:hover { background-color: #343a40; }

    #message {
      min-height: 24px;
      font-weight: bold;
      color: #d9534f;
      margin-bottom: 10px;
      text-align: center;
      font-size: 0.9rem;
    }
    .win-msg { color: #2b8a3e !important; }

    /* シェア・リスタートボタン */
    .action-buttons {
      display: none;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .share-btn { background-color: #1da1f2; }
    .share-btn:hover { background-color: #0d8ddb; }

    /* 下部マルチプレイエリア */
    #multi-section {
      margin-top: 25px;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    #multi-section h3 {
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 10px;
      color: #495057;
    }
    .multi-box {
      margin-bottom: 12px;
    }

    footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #868e96;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <h1>ポケモン当てられるかな？</h1>
  <div id="room-info">👤 1人プレイモード</div>
  <div class="subtitle" id="turn-indicator">5文字のポケモン名を12回以内に当てよう！</div>

  <!-- ゲーム盤面 -->
  <div id="board"></div>

  <div id="message"></div>

  <div class="input-area" id="input-area">
    <input type="text" id="guess-input" maxlength="5" placeholder="例：ピカチュウ" autocomplete="off">
    <button id="submit-btn">決定</button>
  </div>

  <div class="action-buttons" id="action-buttons">
    <button class="share-btn" id="share-btn">結果をコピー</button>
    <button class="sub-btn" id="reset-btn">もう一回遊ぶ</button>
    <button class="sub-btn" id="leave-multi-btn" style="display:none;">1人プレイに戻る</button>
  </div>

  <!-- 画面下部のマルチプレイ用エリア -->
  <div id="multi-section">
    <h3>👥 友達と一緒に遊ぶ（マルチプレイ）</h3>
    <div class="multi-box">
      <button id="create-room-btn" style="font-size:0.85rem; padding:6px 12px;">部屋を作る</button>
      <div id="host-status" style="font-size:0.75rem; color:#666; margin-top:4px;"></div>
    </div>
    <div style="border-top:1px solid #eee; margin:10px 0;"></div>
    <div class="multi-box">
      <input type="text" id="room-id-input" placeholder="部屋IDを入力" style="font-size:0.9rem; width: 130px; padding: 4px 8px;">
      <button id="join-room-btn" class="sub-btn" style="font-size:0.85rem; padding:6px 10px;">参加する</button>
    </div>
    <div id="lobby-message" style="color: #d9534f; font-size: 0.75rem; margin-top: 5px;"></div>
  </div>

  <footer>
    非公式ファンメイドゲーム
  </footer>

  <script>
    // あなたが作ってくれたポケモンリスト
    const POKEMON_5_LIST = [
      "フシギダネ","フシギソウ","フシギバナ","リザードン","カメックス","キャタピー","トランセル","バタフリー","ピジョット","オニスズメ","オニドリル","アーボック","ピカチュウ","ライチュウ","サンドパン","ニドラン♀","ニドリーナ","ニドクイン","ニドラン♂","ニドリーノ","ニドキング","キュウコン","ゴルバット","ナゾノクサ","クサイハナ","ラフレシア","パラセクト","モルフォン","ダグトリオ","ペルシアン","ゴルダック","オコリザル","ウインディ","ニョロボン","ユンゲラー","フーディン","ワンリキー","ゴーリキー","カイリキー","マダツボミ","ウツボット","メノクラゲ","ドククラゲ","イシツブテ","ゴローニャ","ギャロップ","レアコイル","ドードリオ","ベトベター","ベトベトン","シェルダー","パルシェン","スリーパー","キングラー","ビリリダマ","マルマイン","サワムラー","エビワラー","ベロリンガ","マタドガス","サイホーン","モンジャラ","トサキント","アズマオウ","ヒトデマン","スターミー","バリヤード","ストライク","ルージュラ","ケンタロス","コイキング","ギャラドス","シャワーズ","サンダース","ブースター","オムナイト","オムスター","カブトプス","フリーザー","ファイヤー","ミニリュウ","ハクリュー","カイリュー","ミュウツー","チコリータ","ベイリーフ","メガニウム","ヒノアラシ","マグマラシ","バクフーン","アリゲイツ","オーダイル","ヨルノズク","レディアン","アリアドス","クロバット","チョンチー","ランターン","トゲチック","ネイティオ","デンリュウ","キレイハナ","ウソッキー","ニョロトノ","ヒマナッツ","ヤンヤンマ","ブラッキー","ヤミカラス","ヤドキング","アンノーン","ソーナンス","キリンリキ","クヌギダマ","フォレトス","グライガー","ハガネール","グランブル","ハリーセン","ヘラクロス","マグマッグ","マグカルゴ","テッポウオ","デリバード","マンタイン","エアームド","キングドラ","ドンファン","ポリゴン2","カポエラー","ムチュール","エレキッド","ミルタンク","ヨーギラス","サナギラス","バンギラス","ジュプトル","ジュカイン","ワカシャモ","バシャーモ","ミズゴロウ","ヌマクロー","ラグラージ","ジグザグマ","マッスグマ","カラサリス","アゲハント","ドクケイル","ハスブレロ","ルンパッパ","ダーテング","オオスバメ","ペリッパー","サーナイト","アメモース","キノガッサ","ヤルキモノ","ケッキング","テッカニン","ゴニョニョ","バクオング","マクノシタ","ハリテヤマ","エネコロロ","ボスゴドラ","チャーレム","ライボルト","バルビート","イルミーゼ","マルノーム","サメハダー","ホエルオー","ブーピッグ","パッチール","ナックラー","ビブラーバ","フライゴン","チルタリス","ザングース","ハブネーク","ルナトーン","ソルロック","ドジョッチ","シザリガー","ネンドール","ユレイドル","アーマルド","ミロカロス","カクレオン","カゲボウズ","ジュペッタ","サマヨール","トロピウス","ユキワラシ","オニゴーリ","タマザラシ","トドグラー","トドゼルガ","ハンテール","サクラビス","ジーランス","ボーマンダ","メタグロス","レジロック","レジアイス","レジスチル","ラティアス","ラティオス","カイオーガ","グラードン","レックウザ","デオキシス","ハヤシガメ","ドダイトス","モウカザル","ゴウカザル","ポッチャマ","ポッタイシ","エンペルト","ムクバード","ムクホーク","コロボーシ","コロトック","レントラー","ロズレイド","ズガイドス","ラムパルド","タテトプス","トリデプス","ミノムッチ","ミノマダム","ガーメイル","ミツハニー","ビークイン","フローゼル","チェリンボ","カラナクシ","トリトドン","エテボース","フワライド","ミミロップ","ムウマージ","ドンカラス","ニャルマー","ブニャット","リーシャン","スカンプー","スカタンク","ドーミラー","ドータクン","ガ ニゴーン","バリコオル","デスバーン","マホイップ","タイレーツ","バチンウニ","コオリッポ","イエッサン","ドラメシヤ","ドラパルト","ザマゼンタ","ウーラオス","レジエレキ","レジドラゴ","ブリザポス","レイスポス","イダイトウ","ハリーマン","ラブトロス","ニャローテ","アチゲータ","ウェルカモ","ワナイダー","マメバッタ","パーモット","パピモッチ","オリーニョ","オリーヴァ","イキリンコ","ハラバリー","タギングル","ノノクラゲ","リククラゲ","カプサイジ","カヌチャン","ウミトリオ","オトシドリ","ナミイルカ","イルカマン","モトトカゲ","キラフロル","ハカドッグ","カラミンゴ","アルクジラ","ハルクジラ","ミガルーサ","シャリタツ","コノヨザル","リキキリン","ノココッチ","ドドゲザン","セグレイブ","コレクレー","サーフゴー","パオジアン","ディンルー","コライドン","ミライドン","カミッチュ","ヤバソチャ","イイネイヌ","マシマシラ","キチキギス","オーガポン","テラパゴス","モモワロウ"
    ].filter(name => name.length === 5);

    const MAX_TRIES = 12;
    let isMulti = false;
    let peer = null;
    let conn = null;
    let isHost = false;
    let myTurn = true;

    let targetWord = "";
    let currentRow = 0;
    let gameOver = false;
    let emojiHistory = [];

    // DOM要素
    const roomInfo = document.getElementById("room-info");
    const turnIndicator = document.getElementById("turn-indicator");
    const board = document.getElementById("board");
    const input = document.getElementById("guess-input");
    const submitBtn = document.getElementById("submit-btn");
    const messageEl = document.getElementById("message");
    const actionButtons = document.getElementById("action-buttons");
    const lobbyMessage = document.getElementById("lobby-message");
    const resetBtn = document.getElementById("reset-btn");
    const leaveMultiBtn = document.getElementById("leave-multi-btn");
    const multiSection = document.getElementById("multi-section");

    // マルチ：部屋作成
    document.getElementById("create-room-btn").addEventListener("click", () => {
      isMulti = true;
      isHost = true;
      peer = new Peer();
      
      peer.on('open', (id) => {
        document.getElementById("host-status").textContent = `部屋ID: ${id} （共有してね）`;
        lobbyMessage.textContent = "参加者を待っています...";
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
        targetWord = POKEMON_5_LIST[Math.floor(Math.random() * POKEMON_5_LIST.length)];
        initGame();
        myTurn = true;
        updateTurnDisplay();
        
        conn.on('open', () => {
          conn.send({ type: 'START', targetWord: targetWord });
        });
      });
    });

    // マルチ：部屋参加
    document.getElementById("join-room-btn").addEventListener("click", () => {
      const roomId = document.getElementById("room-id-input").value.trim();
      if (!roomId) {
        lobbyMessage.textContent = "部屋IDを入力してね";
        return;
      }

      isMulti = true;
      isHost = false;
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(roomId);
        setupConnection();
      });

      peer.on('error', (err) => {
        lobbyMessage.textContent = "部屋が見つかりませんでした。IDを確認してね";
      });
    });

    function setupConnection() {
      multiSection.style.display = "none"; // マルチ中は下部メニューを隠す
      conn.on('data', (data) => {
        if (data.type === 'START') {
          targetWord = data.targetWord;
          initGame();
          myTurn = false;
          updateTurnDisplay();
        } else if (data.type === 'GUESS') {
          processOpponentGuess(data.guess, data.result, data.row, data.isWin, data.isGameOver);
        }
      });
    }

    // 1人プレイに戻るボタン
    leaveMultiBtn.addEventListener("click", () => {
      if (peer) peer.destroy();
      isMulti = false;
      isHost = false;
      myTurn = true;
      multiSection.style.display = "block";
      document.getElementById("host-status").textContent = "";
      lobbyMessage.textContent = "";
      document.getElementById("room-id-input").value = "";
      initGame();
    });

    // ゲーム初期化
    function initGame() {
      board.innerHTML = "";
      currentRow = 0;
      gameOver = false;
      emojiHistory = [];
      messageEl.textContent = "";
      messageEl.className = "";
      input.value = "";
      actionButtons.style.display = "none";
      
      if (!isMulti) {
        targetWord = POKEMON_5_LIST[Math.floor(Math.random() * POKEMON_5_LIST.length)];
        roomInfo.textContent = "👤 1人プレイモード";
        turnIndicator.textContent = "5文字のポケモン名を12回以内に当てよう！";
        resetBtn.style.display = "inline-block";
        leaveMultiBtn.style.display = "none";
        multiSection.style.display = "block";
      } else {
        roomInfo.textContent = isHost ? "🏠 マルチ（ホスト）" : "🚪 マルチ（ゲスト）";
        resetBtn.style.display = "none";
        leaveMultiBtn.style.display = "inline-block";
      }

      for (let r = 0; r < MAX_TRIES; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          rowDiv.appendChild(tile);
        }
        board.appendChild(rowDiv);
      }
      input.focus();
    }

    function updateTurnDisplay() {
      if (gameOver) return;
      if (!isMulti) {
        turnIndicator.textContent = "5文字のポケモン名を12回以内に当てよう！";
        input.disabled = false;
        submitBtn.disabled = false;
        return;
      }

      if (myTurn) {
        turnIndicator.textContent = "✨ あなたのターンです！ポケモンを入力してください";
        input.disabled = false;
        submitBtn.disabled = false;
        input.focus();
      } else {
        turnIndicator.textContent = "⏳ 相手の入力中...";
        input.disabled = true;
        submitBtn.disabled = true;
      }
    }

    // 決定ボタン
    submitBtn.addEventListener("click", submitGuess);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitGuess();
    });

    function submitGuess() {
      if (gameOver) return;
      if (isMulti && !myTurn) return;

      const guess = input.value.trim();

      if (!/^[ァ-ヶー]{5}$/.test(guess)) {
        showMessage("全角カタカナ5文字で入力してね！");
        return;
      }

      if (!POKEMON_5_LIST.includes(guess)) {
        showMessage("登録されている5文字のポケモン名を入力してね！");
        return;
      }

      showMessage("");

      const result = evaluateGuess(guess, targetWord);
      renderGuess(currentRow, guess, result);

      let rowEmoji = "";
      for(let i=0; i<5; i++) {
        if (result[i] === "correct") rowEmoji += "🟩";
        else if (result[i] === "present") rowEmoji += "🟨";
        else rowEmoji += "⬜";
      }
      emojiHistory.push(rowEmoji);

      let isWin = (guess === targetWord);
      let isOver = isWin || (currentRow + 1 >= MAX_TRIES);

      if (isMulti) {
        conn.send({
          type: 'GUESS',
          guess: guess,
          result: result,
          row: currentRow,
          isWin: isWin,
          isGameOver: isOver
        });
      }

      if (isWin) {
        showMessage(`正解！「${targetWord}」でした！`, true);
        endGame();
      } else if (isOver) {
        showMessage(`残念！正解は「${targetWord}」でした。`);
        endGame();
      } else {
        currentRow++;
        input.value = "";
        if (isMulti) {
          myTurn = false;
          updateTurnDisplay();
        } else {
          input.focus();
        }
      }
    }

    function processOpponentGuess(guess, result, row, isWin, isGameOver) {
      renderGuess(row, guess, result);

      let rowEmoji = "";
      for(let i=0; i<5; i++) {
        if (result[i] === "correct") rowEmoji += "🟩";
        else if (result[i] === "present") rowEmoji += "🟨";
        else rowEmoji += "⬜";
      }
      emojiHistory.push(rowEmoji);

      if (isWin) {
        showMessage(`相手が正解しました！「${targetWord}」でした！`, true);
        endGame();
      } else if (isGameOver) {
        showMessage(`ゲームオーバー！正解は「${targetWord}」でした。`);
        endGame();
      } else {
        currentRow = row + 1;
        myTurn = true;
        updateTurnDisplay();
      }
    }

    function evaluateGuess(guess, target) {
      const targetChars = target.split("");
      const guessChars = guess.split("");
      const result = Array(5).fill("absent");
      const targetUsed = Array(5).fill(false);

      for (let i = 0; i < 5; i++) {
        if (guessChars[i] === targetChars[i]) {
          result[i] = "correct";
          targetUsed[i] = true;
        }
      }
      for (let i = 0; i < 5; i++) {
        if (result[i] === "correct") continue;
        for (let j = 0; j < 5; j++) {
          if (!targetUsed[j] && guessChars[i] === targetChars[j]) {
            result[i] = "present";
            targetUsed[j] = true;
            break;
          }
        }
      }
      return result;
    }

    function renderGuess(row, guess, result) {
      const guessChars = guess.split("");
      for (let i = 0; i < 5; i++) {
        const tile = document.getElementById(`tile-${row}-${i}`);
        tile.textContent = guessChars[i];
        tile.classList.add(result[i]);
      }
    }

    function showMessage(msg, isWin = false) {
      messageEl.textContent = msg;
      messageEl.className = isWin ? "win-msg" : "";
    }

    function endGame() {
      gameOver = true;
      turnIndicator.textContent = "ゲーム終了！お疲れさまでした 🎉";
      document.getElementById("input-area").style.display = "none";
      actionButtons.style.display = "flex";
    }

    // 1人用のもう一回遊ぶボタン
    resetBtn.addEventListener("click", initGame);

    document.getElementById("share-btn").addEventListener("click", () => {
      const score = messageEl.classList.contains("win-msg") ? `${currentRow + 1}/${MAX_TRIES}` : `X/${MAX_TRIES}`;
      const shareText = `ポケモン5文字当てクイズ ${score}\n\n${emojiHistory.join("\n")}\n#ポケモン5文字当て`;
      navigator.clipboard.writeText(shareText).then(() => {
        alert("結果をクリップボードにコピーしました！");
      });
    });

    // 初回起動時（1人プレイとしてスタート）
    initGame();
  </script>
</body>
</html>
